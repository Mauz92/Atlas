# Android client build (SYNC-10, ADR-0075). Manual: Actions > Android > Run workflow.
#
# Builds the debug and the UNSIGNED release APK of apps/desktop for arm64 and uploads them as an artifact. It does not sign (the owner's key
# is never in CI) and it does not run the phone test (`apps/desktop/e2e/android.mjs` needs a USB phone). It runs on the self-hosted runner,
# which must have the toolchain described in apps/desktop/README.md (JDK 17, Android SDK 35 + NDK 27 under ~/.local/android or ANDROID_HOME /
# JAVA_HOME / NDK_HOME set, the four Rust android targets). STATUS: written 2026-11-12, NOT RUN on GitHub yet.
name: Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug and unsigned release APK (arm64)
    runs-on: [self-hosted, atlas]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain present
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/.local/android/sdk}"
          export JAVA_HOME="${JAVA_HOME:-$HOME/.local/android/jdk17}"
          "$JAVA_HOME/bin/java" -version
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk"
          "$HOME/.cargo/bin/rustup" target list --installed | grep -c android
      - name: Rust and TypeScript checks for the shared code
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --locked -p atlas-desktop-native
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the debug APK
        working-directory: apps/desktop
        run: scripts/build-android.sh debug aarch64
      - name: "Build the release APK (unsigned, no key in CI)"
        working-directory: apps/desktop
        run: scripts/build-android.sh release aarch64
      - name: Checksums
        working-directory: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal
        run: sha256sum debug/*.apk release/*.apk | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-android-apk
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/SHA256SUMS
          retention-days: 14
