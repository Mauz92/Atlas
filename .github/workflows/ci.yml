name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the release workflow runs the whole gate first (REL-01)

# SECURITY: every job runs on the owner's self-hosted runner, so a pull request from a fork must never reach it
# (it would run the fork's code on that machine). Each job therefore skips fork PRs; they get no CI until a
# maintainer pushes the branch to this repository. Also set Settings > Actions > General > "Fork pull request
# workflows" to require approval for all outside collaborators.
permissions:
  contents: read

jobs:
  hygiene:
    name: Docs and repository hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, atlas]
    steps:
      - uses: actions/checkout@v4

      - name: Required documentation is present
        run: |
          set -euo pipefail
          required=(
            README.md CONTRIBUTING.md AGENTS.md
            docs/PRODUCT_SPEC.md docs/ARCHITECTURE.md docs/DATA_MODEL.md docs/DECISIONS.md
            docs/RISKS.md docs/ROADMAP.md docs/SECURITY.md docs/TESTING.md
            docs/MARKDOWN_STORAGE.md docs/CALENDAR_SYNC.md docs/DEPLOYMENT.md
            docs/OPERATIONS.md docs/ACCEPTANCE.md docs/CHANGELOG.md docs/DEPENDENCIES.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          exit $missing

      - name: No secrets committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked — never commit real secrets."
            exit 1
          fi

      - name: Docker Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config -q

  backend:
    name: Backend (lint, types, tests)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, atlas]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5433:5432   # not 5432: the self-hosted runner's PC also runs a dev database there
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5433/atlas
      ATLAS_ENV: test
      SECRET_KEY: ci-secret-key
      SESSION_SECRET: ci-session-secret
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python only knows Ubuntu builds and cannot find 3.13 on the self-hosted Arch runner; uv provides the
      # same 3.13 as the Dockerfile (python:3.13) and a venv with pip, put first on PATH for the following steps.
      - name: Python 3.13 (uv)
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13 "$RUNNER_TEMP/py313"
          echo "$RUNNER_TEMP/py313/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/py313" >> "$GITHUB_ENV"

      # pg_dump 17+ (the backup tests run it against the postgres service) is installed on the runner host.

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Dependency audit
        run: pip-audit --progress-spinner off

      - name: Export OpenAPI schema
        run: python -c "import json; from atlas.main import app; open('openapi.json','w').write(json.dumps(app.openapi()))"

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: services/api/openapi.json

  frontend:
    name: Frontend (lint, types, tests, build)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, atlas]
    needs: backend
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: services/api

      - name: Install
        run: npm ci

      - name: Verify generated API types are current
        run: |
          cp src/api/schema.d.ts /tmp/schema.committed.d.ts
          npm run gen:api
          if ! diff -u /tmp/schema.committed.d.ts src/api/schema.d.ts; then
            echo "::error::src/api/schema.d.ts is out of date — run 'npm run gen:api' and commit it."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # Last on purpose: a new advisory must not hide the lint/type/test/build results.
      # Production dependencies (what ships): moderate and above fails the build, no exceptions.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=moderate

      # Development tooling (owner decision 2026-11-09, R-61): still audited and reported on every run, but
      # not blocking while no fix exists. Review by 2026-12-09 or when minimatch (GHSA-g3hv-75wg-m249) is fixed.
      - name: Dependency audit (development tooling, report only)
        continue-on-error: true
        run: npm audit --audit-level=moderate

  e2e-real:
    name: Real-stack journeys (Playwright, real API + PostgreSQL)
    # Self-hosted (the atlas runner on the owner's PC, ci-runners repo): browser libraries come from the host, not apt.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, atlas]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: postgres
        ports:
          - 5433:5432   # not 5432: the self-hosted runner's PC also runs a dev database there
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The harness creates and drops its own atlas_e2e_<random> database on this server (MU-00).
      ATLAS_E2E_ADMIN_DATABASE_URL: postgresql://atlas:atlas@localhost:5433/postgres
      # `pip install` below puts python and atlas-migrate in this venv.
      ATLAS_E2E_API_BIN_DIR: ${{ github.workspace }}/services/api/.venv/bin
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python only knows Ubuntu builds and cannot find 3.13 on the self-hosted Arch runner; uv provides the
      # same 3.13 as the Dockerfile (python:3.13) and a venv with pip, put first on PATH for the following steps.
      - name: Python 3.13 (uv)
        run: |
          uv python install 3.13
          uv venv --seed --python 3.13 "$RUNNER_TEMP/py313"
          echo "$RUNNER_TEMP/py313/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/py313" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the API from source
        working-directory: services/api
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        # No --with-deps: Ubuntu's package servers were unreachable from GitHub runners on 2026-11-11 (four runs), and the
        # ubuntu-24.04 runner image already carries the browser libraries. If a future image lacks one, Chromium says which.
        run: npx playwright install chromium

      - name: Real-stack journeys
        working-directory: apps/web
        run: npm run test:e2e:real

  containers:
    name: Container images build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, atlas]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f deploy/docker-compose.yml build
