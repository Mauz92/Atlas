# Release pipeline (REL-01, ADR-0074, docs/DEPLOYMENT.md section 12).
#
#   git tag v0.2.0 && git push origin v0.2.0      -> gate, images, desktop clients, GitHub Release
#   Actions > Release > Run workflow              -> the same build WITHOUT publishing (a dry run; artifacts only)
#
# What a release is: the full CI gate passing on the tagged commit; the server images (ghcr.io/<owner>/atlas-api and
# atlas-web, tagged with the version) smoke-tested through the release compose file before they are pushed; the Linux
# desktop clients (AppImage, .deb); optionally Windows (repository variable ATLAS_BUILD_WINDOWS=true, billed at a higher
# rate on private repositories and NOT verified yet); `atlas-deploy.tar.gz` (the compose files the host updater installs)
# and SHA256SUMS. The release is created as a draft and published last, so the host updater never sees half a release.
# Third-party actions are pinned to commit SHAs (docs/DEPENDENCIES.md); everything else uses the docker and gh CLIs.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a dry run, e.g. 0.0.1 (a tag push uses the tag)"
        required: true
        default: "0.0.1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Version and guard rails
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"; publish=true
            # A release is only ever cut from main: a tag on a side branch is refused.
            git fetch origin main --quiet
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
          else
            version="${{ inputs.version }}"; publish=false
          fi
          [[ "$version" =~ ^[0-9]{1,4}\.[0-9]{1,5}\.[0-9]{1,5}$ ]] || { echo "::error::'$version' is not X.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (publish=$publish)"

  gate:
    name: CI gate on this commit
    needs: plan
    uses: ./.github/workflows/ci.yml

  images:
    name: Server images (build, smoke test, push)
    needs: [plan, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REGISTRY: ghcr.io/${{ needs.plan.outputs.owner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        run: |
          set -euo pipefail
          docker build --build-arg "ATLAS_VERSION=$VERSION" -t "$REGISTRY/atlas-api:$VERSION" services/api
          docker build -t "$REGISTRY/atlas-web:$VERSION" apps/web

      # The images are started through the same compose files the server uses, so a broken override or a missing
      # setting fails here and not during somebody's update.
      - name: Smoke test through deploy/docker-compose.release.yml
        run: |
          set -euo pipefail
          mkdir -p update && echo "ATLAS_VERSION=$VERSION" > update/version.env && touch .env
          export ATLAS_IMAGE_REGISTRY="$REGISTRY"
          DC="docker compose -p smoke --env-file .env --env-file update/version.env -f deploy/docker-compose.yml -f deploy/docker-compose.release.yml"
          $DC up -d --no-build
          for i in $(seq 1 60); do
            out="$($DC exec -T api python -c "import json,urllib.request as u; print(json.load(u.urlopen('http://localhost:8000/health'))['version'])" 2>/dev/null || true)"
            [ "$out" = "$VERSION" ] && break; sleep 3
          done
          [ "$out" = "$VERSION" ] || { echo "::error::api reports '$out', expected $VERSION"; $DC logs api | tail -40; exit 1; }
          $DC exec -T api python -c "import urllib.request as u,sys; sys.exit(0 if b'ready' in u.urlopen('http://localhost:8000/health/ready').read() else 1)"
          $DC exec -T api alembic current
          $DC down -v

      - name: Push
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$REGISTRY/atlas-api:$VERSION"
          docker push "$REGISTRY/atlas-web:$VERSION"

  desktop-linux:
    name: Desktop client, Linux (AppImage, .deb)
    needs: [plan, gate]
    runs-on: ubuntu-22.04   # the oldest supported runner: an AppImage runs on distributions with this glibc or newer
    timeout-minutes: 45
    env:
      ATLAS_VERSION: ${{ needs.plan.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: System libraries
        run: |
          # Bounded: Ubuntu's package servers were unreachable from GitHub runners on 2026-11-11 and this step hung for an hour.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          timeout 600 sudo apt-get $APT update -q
          timeout 900 sudo apt-get $APT install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential file
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: apps/desktop -> target
      - name: Build
        run: apps/desktop/scripts/build-linux.sh
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/desktop/out/current/Atlas_${ATLAS_VERSION}_amd64.AppImage apps/desktop/out/current/Atlas_${ATLAS_VERSION}_amd64.deb dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-linux
          path: dist/*
          if-no-files-found: error

  # EXPERIMENTAL and off by default: the Windows build of the desktop app has not been verified (SYNC-09 phase 2). It
  # runs only when the repository variable ATLAS_BUILD_WINDOWS is "true", and a failure does not stop a release.
  desktop-windows:
    name: Desktop client, Windows (experimental)
    if: vars.ATLAS_BUILD_WINDOWS == 'true'
    needs: [plan, gate]
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      ATLAS_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Rust stable (MSVC)
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: apps/desktop -> target
      - name: Build
        working-directory: apps/desktop
        run: |
          Push-Location ../web; npm ci --no-audit --no-fund; npm run build; Pop-Location
          npm ci --no-audit --no-fund
          npm run stage
          npx tauri build --bundles nsis --config "{`"version`":`"$env:ATLAS_VERSION`"}" -- --locked
      - name: Collect
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item apps/desktop/target/release/bundle/nsis/*.exe dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [plan, images, desktop-linux, desktop-windows]
    # The Windows job may be skipped or fail without blocking a release; the others may not.
    if: always() && needs.images.result == 'success' && needs.desktop-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Gather the desktop clients
        run: |
          set -euo pipefail
          mkdir -p assets
          gh run download "${{ github.run_id }}" --name desktop-linux --dir assets
          if [ "${{ needs.desktop-windows.result }}" = "success" ]; then
            gh run download "${{ github.run_id }}" --name desktop-windows --dir assets
          fi

      # What the host updater installs on the server: the compose files and the nginx configs, nothing else
      # (the updater accepts only these paths from the archive).
      - name: Deploy bundle and checksums
        run: |
          set -euo pipefail
          tar -czf assets/atlas-deploy.tar.gz \
            --exclude='deploy/tls' --exclude='*.pyc' \
            deploy apps/web/nginx.conf apps/web/nginx.tls.conf
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Dry run stops here
        if: needs.plan.outputs.publish != 'true'
        run: echo "Dry run - nothing is published. The assets above are what a release would contain."

      - name: Publish (draft first, public last)
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gh release create "v$VERSION" assets/* --draft --verify-tag --title "Atlas $VERSION" --generate-notes
          gh release edit "v$VERSION" --draft=false --latest
