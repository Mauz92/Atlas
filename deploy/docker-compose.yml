# Atlas — Docker Compose deployment.
#
# Only `api` and `web` are intended to be reached through a reverse proxy. `db` publishes
# to loopback only (for local development and migrations); `worker` publishes nothing.
#
# Copy ../.env.example to ../.env and set real secrets before a production deployment.

# Every setting the api and worker read, forwarded to both services from one place (a setting
# forwarded to only one of them drifted before). tests/unit/test_compose_env.py fails when the
# application gains a setting that is neither listed here nor explicitly exempted.
x-atlas-env: &atlas-env
    ATLAS_ENV: ${ATLAS_ENV:-development}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    # Built from the same POSTGRES_* values that initialise the db service, so the two cannot
    # disagree (a separate DATABASE_URL in .env used to leave the api unable to log in to db).
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas}@db:5432/${POSTGRES_DB:-atlas}
    NOTES_ROOT: ${NOTES_ROOT:-/data/atlas/notes}
    BACKUP_DIR: ${BACKUP_DIR:-/data/atlas/backups}
    UPDATE_DIR: ${UPDATE_DIR:-}
    BACKUP_RETAIN: ${BACKUP_RETAIN:-7}
    BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
    SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
    TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-insecure-change-me}
    TOKEN_ENCRYPTION_KEY_ID: ${TOKEN_ENCRYPTION_KEY_ID:-v1}
    TOKEN_ENCRYPTION_PREVIOUS_KEYS: ${TOKEN_ENCRYPTION_PREVIOUS_KEYS:-{}}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1209600}
    AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
    RECOVERY_ENABLED: ${RECOVERY_ENABLED:-true}
    EXPORT_DIR: ${EXPORT_DIR:-/data/atlas/exports}
    CHANGE_RETENTION_DAYS: ${CHANGE_RETENTION_DAYS:-90}
    CHANGE_PURGE_INTERVAL_SECONDS: ${CHANGE_PURGE_INTERVAL_SECONDS:-3600}
    NOTES_RECONCILE_SECONDS: ${NOTES_RECONCILE_SECONDS:-300}
    REMINDER_SCAN_SECONDS: ${REMINDER_SCAN_SECONDS:-60}
    CALENDAR_RECONCILE_SECONDS: ${CALENDAR_RECONCILE_SECONDS:-300}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
    MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
    ICS_POLL_SECONDS: ${ICS_POLL_SECONDS:-900}
    ICS_MAX_BYTES: ${ICS_MAX_BYTES:-10485760}
    ICS_TIMEOUT_SECONDS: ${ICS_TIMEOUT_SECONDS:-20}
    ICS_ALLOW_HTTP: ${ICS_ALLOW_HTTP:-false}
    ICS_ALLOW_PRIVATE_HOSTS: ${ICS_ALLOW_PRIVATE_HOSTS:-false}
    CALENDAR_WINDOW_PAST_DAYS: ${CALENDAR_WINDOW_PAST_DAYS:-90}
    CALENDAR_WINDOW_FUTURE_DAYS: ${CALENDAR_WINDOW_FUTURE_DAYS:-365}
    CALENDAR_OAUTH_STATE_TTL_SECONDS: ${CALENDAR_OAUTH_STATE_TTL_SECONDS:-600}
    # Test/dev only; the API refuses to start with it in production.
    CALENDAR_FAKE_PROVIDER_URL: ${CALENDAR_FAKE_PROVIDER_URL:-}
    TTRPG_SRD_ENABLED: ${TTRPG_SRD_ENABLED:-true}
    TTRPG_SRD_BASE_URL: ${TTRPG_SRD_BASE_URL:-https://www.dnd5eapi.co}
    TTRPG_SRD_TIMEOUT_SECONDS: ${TTRPG_SRD_TIMEOUT_SECONDS:-8}
    NOTE_HISTORY_KEEP_REVISIONS: ${NOTE_HISTORY_KEEP_REVISIONS:-20}
    NOTE_HISTORY_KEEP_DAYS: ${NOTE_HISTORY_KEEP_DAYS:-90}
    NOTE_HISTORY_MAX_REVISIONS: ${NOTE_HISTORY_MAX_REVISIONS:-200}
    NOTE_HISTORY_MAX_BYTES: ${NOTE_HISTORY_MAX_BYTES:-67108864}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    SYNC_WAIT_MAX_SECONDS: ${SYNC_WAIT_MAX_SECONDS:-25}
    SYNC_WAIT_POLL_SECONDS: ${SYNC_WAIT_POLL_SECONDS:-2}
    SYNC_WAIT_MAX_CONNECTIONS: ${SYNC_WAIT_MAX_CONNECTIONS:-4}
    SYNC_HINT_ENABLED: ${SYNC_HINT_ENABLED:-false}
    SYNC_HINT_GATEWAY_URL: ${SYNC_HINT_GATEWAY_URL:-}
    SYNC_HINT_GATEWAY_TOKEN: ${SYNC_HINT_GATEWAY_TOKEN:-}
    SYNC_HINT_ALLOW_INSECURE_HTTP: ${SYNC_HINT_ALLOW_INSECURE_HTTP:-false}
    SYNC_HINT_MIN_INTERVAL_SECONDS: ${SYNC_HINT_MIN_INTERVAL_SECONDS:-30}
    SYNC_HINT_TIMEOUT_SECONDS: ${SYNC_HINT_TIMEOUT_SECONDS:-5}
    SYNC_HINT_ON_REMINDER: ${SYNC_HINT_ON_REMINDER:-true}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - atlas-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
      args:
        ATLAS_VERSION: ${ATLAS_VERSION:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *atlas-env
    volumes:
      - atlas-notes:/data/atlas/notes
      - atlas-backups:/data/atlas/backups
      - atlas-exports:/data/atlas/exports
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "atlas-migrate && uvicorn atlas.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../services/api
      args:
        ATLAS_VERSION: ${ATLAS_VERSION:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment: *atlas-env
    volumes:
      - atlas-notes:/data/atlas/notes
      - atlas-backups:/data/atlas/backups
      - atlas-exports:/data/atlas/exports
    command: ["atlas-worker"]

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Loopback by default: HTTPS is terminated by `tailscale serve` or a reverse proxy on this host
      # (docs/DEPLOYMENT.md section 8). Set WEB_BIND=0.0.0.0 only behind a firewall you control.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  atlas-db:
  atlas-notes:
  atlas-backups:
  atlas-exports:
