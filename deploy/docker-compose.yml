# Atlas — Docker Compose deployment.
#
# Only `api` and `web` are intended to be reached through a reverse proxy. `db` publishes
# to loopback only (for local development and migrations); `worker` publishes nothing.
#
# Copy ../.env.example to ../.env and set real secrets before a production deployment.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
    volumes:
      - atlas-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://atlas:atlas@db:5432/atlas}
      NOTES_ROOT: ${NOTES_ROOT:-/data/atlas/notes}
      BACKUP_DIR: ${BACKUP_DIR:-/data/atlas/backups}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-insecure-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TOKEN_ENCRYPTION_KEY_ID: ${TOKEN_ENCRYPTION_KEY_ID:-v1}
      EXPORT_DIR: ${EXPORT_DIR:-/data/atlas/exports}
      CHANGE_RETENTION_DAYS: ${CHANGE_RETENTION_DAYS:-90}
      CHANGE_PURGE_INTERVAL_SECONDS: ${CHANGE_PURGE_INTERVAL_SECONDS:-3600}
      NOTES_RECONCILE_SECONDS: ${NOTES_RECONCILE_SECONDS:-300}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - atlas-notes:/data/atlas/notes
      - atlas-backups:/data/atlas/backups
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "atlas-migrate && uvicorn atlas.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://atlas:atlas@db:5432/atlas}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      NOTES_ROOT: ${NOTES_ROOT:-/data/atlas/notes}
      BACKUP_DIR: ${BACKUP_DIR:-/data/atlas/backups}
      BACKUP_RETAIN: ${BACKUP_RETAIN:-7}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-insecure-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      TOKEN_ENCRYPTION_KEY_ID: ${TOKEN_ENCRYPTION_KEY_ID:-v1}
      EXPORT_DIR: ${EXPORT_DIR:-/data/atlas/exports}
      CHANGE_RETENTION_DAYS: ${CHANGE_RETENTION_DAYS:-90}
      CHANGE_PURGE_INTERVAL_SECONDS: ${CHANGE_PURGE_INTERVAL_SECONDS:-3600}
      NOTES_RECONCILE_SECONDS: ${NOTES_RECONCILE_SECONDS:-300}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - atlas-notes:/data/atlas/notes
      - atlas-backups:/data/atlas/backups
    command: ["atlas-worker"]

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  atlas-db:
  atlas-notes:
  atlas-backups:
