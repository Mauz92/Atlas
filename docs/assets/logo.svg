<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Atlas logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- contour lines: an atlas is a book of maps -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="6">
    <circle cx="256" cy="300" r="190"/>
    <circle cx="256" cy="300" r="140"/>
    <circle cx="256" cy="300" r="90"/>
  </g>
  <!-- the A: a peak with a crossbar, and a waypoint above it -->
  <path d="M146 394 L256 170 L366 394" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 316 H322" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
  <circle cx="256" cy="106" r="24" fill="#bfdbfe"/>
</svg>
