# Keep the scheme an HTTPS-terminating proxy in front of this container reports (tailscale serve,
# Caddy); fall back to this hop's own scheme when there is none. docs/DEPLOYMENT.md section 8.
map $http_x_forwarded_proto $atlas_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Request bodies: small by default (nginx's own default is 1m; stated so it is a decision, not
    # an accident). Only /api/ is raised, below. Everything else is static files and GET requests.
    client_max_body_size 1m;

    # API and health are proxied to the backend; the API sets its own security headers on every
    # response (atlas/middleware.py), so none are added to these proxied locations.
    location /api/ {
        # A note may be up to 5 MiB (MAX_NOTE_BYTES) and is sent as JSON, where every newline,
        # tab, quote and backslash costs two bytes: a 5 MiB note of nothing but those is 10 MiB
        # plus the envelope. 11m covers that worst case; the API itself enforces the real per-note
        # limit and answers 413. (Only control characters, 6 bytes each, can exceed it; they are
        # not text anyone writes.) R-34, docs/DEPLOYMENT.md section 8; the directive is checked
        # against MAX_NOTE_BYTES by tests/unit/test_nginx_config.py.
        client_max_body_size 11m;

        # GET /api/sync/wait is a long poll (M8-04e): the API holds it at most SYNC_WAIT_MAX_SECONDS
        # (25 by default, 55 at most). nginx's default read timeout is 60 s; 75 s leaves a margin
        # and is stated here so a change of the default cannot silently cut the hold. Response
        # buffering stays on: the answer is a few bytes, there is no streaming. Checked by
        # tests/unit/test_nginx_config.py.
        proxy_read_timeout 75s;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, never append: the API trusts this single value
        proxy_set_header X-Forwarded-Proto $atlas_forwarded_proto;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # The SPA document and its assets. Standard security headers are set here because the API's
    # headers only cover /api responses; the browser executes the untrusted-content rendering path
    # (the Markdown preview) from this document (SECURITY.md §5, threats T6/T9).
    #
    # The Content-Security-Policy mirrors the API's defence in depth. It is permissive enough for
    # the built app: CodeMirror injects <style> elements, so style-src needs 'unsafe-inline'; the
    # Vite bundle ships no inline scripts, so script-src stays 'self'. NOTE: the operator terminates
    # TLS at their own reverse proxy (docs/DEPLOYMENT.md §8), so HSTS belongs there, not here.
    # Verified by config inspection only — nginx is not part of the test harness (see ACCEPTANCE.md).
    # theme-init.js has a fixed URL (it must run before first paint, so it cannot be hashed): make the
    # browser revalidate it, or an old cached copy ignores newer stored choices such as the Tavern palette.
    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
