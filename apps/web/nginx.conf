server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and health are proxied to the backend; the API sets its own security headers on every
    # response (atlas/middleware.py), so none are added to these proxied locations.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # The SPA document and its assets. Standard security headers are set here because the API's
    # headers only cover /api responses; the browser executes the untrusted-content rendering path
    # (the Markdown preview) from this document (SECURITY.md §5, threats T6/T9).
    #
    # The Content-Security-Policy mirrors the API's defence in depth. It is permissive enough for
    # the built app: CodeMirror injects <style> elements, so style-src needs 'unsafe-inline'; the
    # Vite bundle ships no inline scripts, so script-src stays 'self'. NOTE: the operator terminates
    # TLS at their own reverse proxy (docs/DEPLOYMENT.md §8), so HSTS belongs there, not here.
    # Verified by config inspection only — nginx is not part of the test harness (see ACCEPTANCE.md).
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
