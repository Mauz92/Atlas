[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas application API and background worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "argon2-cffi>=23.1,<26.0",
    "itsdangerous>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dateutil>=2.9,<4.0",
    "cryptography>=50,<51",
    "pywebpush>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
]

[project.scripts]
atlas-worker = "atlas.worker:main"
atlas-migrate = "atlas.migrations:main"
atlas-backup = "atlas.backups.cli:main"
atlas-export = "atlas.export.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["atlas", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["atlas", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
files = ["atlas"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dateutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pywebpush", "pywebpush.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
