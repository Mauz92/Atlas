[package]
name = "atlas-spike-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "atlas_spike_core"

[[bin]]
name = "spike-headless"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
serde_json = "1"
serde = "1"

# Windows: Credential Manager backend (without a platform feature keyring 3 silently uses a mock store).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native", "crypto-rust"] }

# Linux only: Android has no keyring backend (S4 needs a Kotlin Keystore plugin, see SYNC_PROTOCOL.md 13.4).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
