[package]
name = "atlas-spike"
version = "0.1.0"
description = "SYNC-07 Tauri 2 spike (throwaway, not part of the product)"
edition = "2021"
publish = false

[lib]
name = "atlas_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
atlas-spike-core = { path = "../headless" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }

# Windows: Credential Manager backend (without a platform feature keyring 3 silently uses a mock store).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
gtk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }

[features]
# `tauri build` enables this; plain `cargo build --release --features custom-protocol` serves the embedded UI.
custom-protocol = ["tauri/custom-protocol"]
